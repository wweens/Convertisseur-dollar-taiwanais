<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103e49"><title>Convertisseur Taïwan</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px;background:#edf5f3;font-family:system-ui,sans-serif;color:#17333a}.app{width:min(100%,430px);padding:24px;background:white;border-radius:26px;box-shadow:0 12px 40px #1233}h1{font-size:23px;margin:0 0 5px}small{color:#66818a}.tabs{display:flex;gap:5px;background:#edf4f3;padding:5px;border-radius:15px;margin:25px 0}.tabs button{flex:1}.tabs button.active,.refresh{background:#103e49;color:white}button{border:0;border-radius:12px;padding:13px 8px;font-weight:700;background:#edf4f3;color:#17333a}label{display:block;font-size:14px;font-weight:650;margin-bottom:9px}input{width:100%;padding:15px;border:2px solid #bdd5d2;border-radius:15px;font-size:30px;font-weight:750;color:#123b43}.output{margin-top:18px;padding:20px;background:#e6f6ed;border-radius:18px}.output span{font-size:13px}.output strong{display:block;font-size:34px;overflow-wrap:anywhere;margin-top:6px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}.bottom{display:flex;align-items:center;gap:12px;margin-top:23px}#status{flex:1;font-size:12px;line-height:1.5;color:#66818a}.note{font-size:12px;line-height:1.5;color:#66818a;margin-top:18px}</style><link rel="icon" type="image/png" href="a_clean_colorful_app_icon_style_illustration_in_a.png"><link rel="apple-touch-icon" href="a_clean_colorful_app_icon_style_illustration_in_a.png"><link rel="manifest" href="manifest.webmanifest"></head><body><main class="app"><h1>🇹🇼 Convertisseur Taïwan</h1><small>Dollar taïwanais ↔ Euro</small><div class="tabs"><button id="twd" class="active">TWD → EUR</button><button id="eur">EUR → TWD</button></div><label id="label" for="amount">Montant en dollars taïwanais</label><input id="amount" type="number" inputmode="decimal" min="0" value="500"><div class="output"><span>Montant converti</span><strong id="result">—</strong></div><div id="chips" class="chips"></div><div class="bottom"><span id="status" aria-live="polite"></span><button class="refresh" id="refresh">↻ Actualiser</button></div><p class="note">Taux indicatif hors frais bancaires. Le dernier taux récupéré reste disponible hors connexion, si la page est accessible.</p></main><script>const $=x=>document.getElementById(x);let dir='TWD',rate=Number(localStorage.getItem('twd_eur_rate'))||0.0274,date=localStorage.getItem('twd_eur_date');const fmt=(n,c)=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:c,maximumFractionDigits:2}).format(n);function render(){let n=Number($('amount').value)||0;$('result').textContent=fmt(dir==='TWD'?n*rate:n/rate,dir==='TWD'?'EUR':'TWD');$('label').textContent=dir==='TWD'?'Montant en dollars taïwanais':'Montant en euros';$('twd').classList.toggle('active',dir==='TWD');$('eur').classList.toggle('active',dir==='EUR');$('chips').replaceChildren();(dir==='TWD'?[100,200,500,1000]:[5,10,20,50]).forEach(n=>{let b=document.createElement('button');b.textContent=n.toLocaleString('fr-FR');b.onclick=()=>{$('amount').value=n;render()};$('chips').append(b)});$('status').textContent=date?'Taux du '+date+' · 1 TWD ≈ '+rate.toFixed(4)+' €':'Taux de secours non actualisé'}async function update(){$('status').textContent='Actualisation…';try{let r=await fetch('https://open.er-api.com/v6/latest/TWD',{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();if(d.result!=='success'||!(d.rates?.EUR>0))throw Error();rate=d.rates.EUR;date=d.time_last_update_utc?new Date(d.time_last_update_utc).toLocaleDateString('fr-FR'):new Date().toLocaleDateString('fr-FR');localStorage.setItem('twd_eur_rate',rate);localStorage.setItem('twd_eur_date',date);render()}catch(e){render();$('status').textContent=date?'Connexion indisponible · dernier taux du '+date:'Connexion indisponible · taux de secours'}}$('twd').onclick=()=>{dir='TWD';render()};$('eur').onclick=()=>{dir='EUR';render()};$('amount').oninput=render;$('refresh').onclick=update;render();update();</script></body></html>
